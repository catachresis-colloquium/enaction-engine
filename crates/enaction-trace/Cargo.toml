[package]
name = "enaction-trace"
description = "Small typed event seam for deterministic cognitive-affective-conative traces."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true

[dev-dependencies]
# Test-only: drives the observer-noninterference property (tests/observer.rs).
proptest = { version = "1", default-features = false, features = ["std"] }
# Test-only: proves the serde boundary rejects out-of-range Mass values.
# The runtime dependency closure remains serde alone.
serde_json = "1"
