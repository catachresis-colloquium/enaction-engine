# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "enaction-contracts"
description = "The estate's ESM/CAC contract as types: versioning, bounded confidence policy, provenance and package validation."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
enaction-version = { workspace = true, features = ["serde"] }
serde.workspace = true
enaction-trace.workspace = true
# Stage 2 of WEEVIL-HOST-ROUTE A2 (ADR-0024): the package digest is SHA-256
# over canonical JCS bytes, computed here so no caller can vouch for a
# mutated package.
sha2 = "0.10"
# Typed decoding of the strict, already-validated wire documents (the
# envelope, the policy file and the mind trace) for enaction-validate.
# Promoted from a dev-dependency.
serde_json = "1"
# Reports the stable field path of a typed decoding fault (UnknownField).
serde_path_to_error = "0.1"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
# serde_json is now a normal dependency (above); tests use it too.
