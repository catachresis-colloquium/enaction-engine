# SPDX-License-Identifier: MPL-2.0
[package]
name = "enaction-version"
description = "The two-part contract version and its compatibility rule: the leaf crate that carries Creusot contracts and is proved whole."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Off by default, so that the crate Creusot proves has one dependency.
# enaction-contracts turns it on for the wire form.
serde = ["dep:serde"]

[dependencies]
creusot-std.workspace = true
serde = { workspace = true, optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(creusot)'] }
