# SonarQube Cloud (SonarCloud) configuration.
#
# The owner ruled on 2026-11-15 that the SonarCloud organisation is
# catachresis-colloquium. The project key is therefore
# catachresis-colloquium_enaction-engine. This replaces the earlier assumed
# organisation, which was never verified.
#
# The owner binds the project in SonarQube Cloud by importing
# catachresis-colloquium/enaction-engine into that organisation, with
# automatic analysis for pull requests and main. Until the project is bound,
# the official app posts no check here and the SonarCloud Queue Gate stays red.
# Project: https://sonarcloud.io/project/overview?id=catachresis-colloquium_enaction-engine
sonar.organization=catachresis-colloquium
sonar.projectKey=catachresis-colloquium_enaction-engine

# Analysable surface = shell scripts + any JS/TS the template carries. Idris2,
# Zig, Elixir and AffineScript have no SonarCloud analyser; vendored, generated,
# build, proof, doc-template and dependency trees are excluded to keep findings
# signal-rich (mirrors the boj-server arrangement).
sonar.exclusions=LICENSE,LICENSES/**,docs/legal/**,build/**,container/**,generated/**,**/node_modules/**,**/_build/**,**/deps/**,**/.lake/**,verification/**,docs-template/**,machine-readable-design/**,**/*.idr,**/*.ipkg,**/*.zig
sonar.coverage.exclusions=tests/**,**/*test*
