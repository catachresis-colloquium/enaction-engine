# SPDX-License-Identifier: AGPL-3.0-or-later
# Static Analysis Gate — scanner failures and report/schema drift fail closed.
# Tool sources are pinned in scripts/build-static-analysis-tools.sh; this gate
# intentionally records scope and does not treat absent scanner output as clean.
name: Static Analysis Gate
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  scanner-tools:
    name: Build pinned static-analysis tools
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned scanner binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner-tools"
          ./scripts/build-static-analysis-tools.sh "$RUNNER_TEMP/scanner-tools"
      - name: Test JSON/JCS contracts with pinned ijson-jcs
        run: |
          set -euo pipefail
          PATH="$RUNNER_TEMP/scanner-tools:$PATH" bash tests/workflows/static_analysis_report_test.sh
      - name: Package pinned scanner binaries
        run: tar -czf "$RUNNER_TEMP/scanner-tools.tar.gz" -C "$RUNNER_TEMP/scanner-tools" .
      - name: Upload pinned scanner binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: static-analysis-tools
          path: ${{ runner.temp }}/scanner-tools.tar.gz
          retention-days: 1

  panic-attack-assail:
    name: panic-attack assail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [scanner-tools]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download pinned scanner binaries
        uses: actions/download-artifact@v8.0.2
        with:
          name: static-analysis-tools
          path: ${{ runner.temp }}/scanner-tools-artifact
      - name: Unpack pinned scanner binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner-tools"
          tar -xzf "$RUNNER_TEMP/scanner-tools-artifact/scanner-tools.tar.gz" -C "$RUNNER_TEMP/scanner-tools"
          chmod 0755 "$RUNNER_TEMP/scanner-tools"/*
          echo "$RUNNER_TEMP/scanner-tools" >> "$GITHUB_PATH"
      - name: Run panic-attack assail and validate its report
        id: assail
        run: |
          set -euo pipefail
          panic-attack --quiet assail . --output "$RUNNER_TEMP/panic-attack-findings.raw.json"
          ./scripts/static-analysis-report.sh canonicalize \
            "$RUNNER_TEMP/panic-attack-findings.raw.json" panic-attack-findings.json
          ./scripts/static-analysis-report.sh validate-panic panic-attack-findings.json

          TOTAL=$(jq '[.weak_points[] | select(.suppressed != true)] | length' panic-attack-findings.json)
          CRITICAL=$(jq '[.weak_points[] | select(.suppressed != true and .severity == "Critical")] | length' panic-attack-findings.json)
          HIGH=$(jq '[.weak_points[] | select(.suppressed != true and .severity == "High")] | length' panic-attack-findings.json)
          MEDIUM=$(jq '[.weak_points[] | select(.suppressed != true and .severity == "Medium")] | length' panic-attack-findings.json)
          LOW=$(jq '[.weak_points[] | select(.suppressed != true and .severity == "Low")] | length' panic-attack-findings.json)

          printf 'total=%s\ncritical=%s\nhigh=%s\nmedium=%s\nlow=%s\n' \
            "$TOTAL" "$CRITICAL" "$HIGH" "$MEDIUM" "$LOW" >> "$GITHUB_OUTPUT"
      - name: Emit panic-attack annotations
        run: |
          set -euo pipefail
          jq -r --arg ws "$GITHUB_WORKSPACE" '
            # Return input as text with %, CR, LF, colon, and comma escaped
            # for GitHub workflow annotations.
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub(":"; "%3A") | gsub(","; "%2C");
            .weak_points[]
            | select(.suppressed != true and .file != null)
            | (.file | ltrimstr($ws + "/") | esc) as $file
            | (.line // 1) as $line
            | (.description | esc) as $message
            | if .severity == "Critical" or .severity == "High" then
                "::error file=\($file),line=\($line)::[panic-attack] \($message)"
              else
                "::warning file=\($file),line=\($line)::[panic-attack] \($message)"
              end
          ' panic-attack-findings.json
      - name: Write panic-attack summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## panic-attack assail Results

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.assail.outputs.critical }} |
          | High     | ${{ steps.assail.outputs.high }} |
          | Medium   | ${{ steps.assail.outputs.medium }} |
          | Low      | ${{ steps.assail.outputs.low }} |
          | **Total**| ${{ steps.assail.outputs.total }} |
          EOF
      - name: Upload panic-attack findings
        uses: actions/upload-artifact@v7.0.2
        with:
          name: panic-attack-findings
          path: panic-attack-findings.json
          retention-days: 90
      - name: Fail on critical findings
        if: steps.assail.outputs.critical > 0
        run: |
          echo "::error::panic-attack found ${{ steps.assail.outputs.critical }} critical issue(s) — blocking merge"
          exit 1

  hypatia-scan:
    name: Hypatia neurosymbolic scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [scanner-tools]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download pinned scanner binaries
        uses: actions/download-artifact@v8.0.2
        with:
          name: static-analysis-tools
          path: ${{ runner.temp }}/scanner-tools-artifact
      - name: Unpack pinned scanner binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner-tools"
          tar -xzf "$RUNNER_TEMP/scanner-tools-artifact/scanner-tools.tar.gz" -C "$RUNNER_TEMP/scanner-tools"
          chmod 0755 "$RUNNER_TEMP/scanner-tools"/*
          echo "$RUNNER_TEMP/scanner-tools" >> "$GITHUB_PATH"
      - name: Setup Elixir for pinned Hypatia scanner
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: '1.19.4'
          otp-version: '28.3'
      - name: Build pinned Hypatia source
        run: |
          set -euo pipefail
          readonly HYPATIA_COMMIT="9a5db53f3b22bdd3e2a10f430ead5fd8a793711d"
          git init -q "$HOME/hypatia"
          git -C "$HOME/hypatia" remote add origin https://github.com/hyperpolymath/hypatia.git
          git -C "$HOME/hypatia" fetch -q --depth=1 origin "$HYPATIA_COMMIT"
          git -C "$HOME/hypatia" checkout -q --detach FETCH_HEAD
          test "$(git -C "$HOME/hypatia" rev-parse HEAD)" = "$HYPATIA_COMMIT"
          cd "$HOME/hypatia"
          mix deps.get
          MIX_NO_PUBSUB=1 mix escript.build
          test -x "$HOME/hypatia/hypatia"
      - name: Run Hypatia and validate its report
        id: scan
        run: |
          set -euo pipefail
          HYPATIA_FORMAT=json "$HOME/hypatia/hypatia-cli.sh" scan "$GITHUB_WORKSPACE" --exit-zero > "$RUNNER_TEMP/hypatia-findings.raw.json"
          ijson-jcs canon < "$RUNNER_TEMP/hypatia-findings.raw.json" > hypatia-findings.json
          ./scripts/static-analysis-report.sh validate-hypatia hypatia-findings.json

          TOTAL=$(jq 'length' hypatia-findings.json)
          CRITICAL=$(jq '[.[] | select(.severity == "critical")] | length' hypatia-findings.json)
          HIGH=$(jq '[.[] | select(.severity == "high")] | length' hypatia-findings.json)
          MEDIUM=$(jq '[.[] | select(.severity == "medium" or .severity == "warn" or .severity == "warning")] | length' hypatia-findings.json)
          LOW=$(jq '[.[] | select(.severity == "low")] | length' hypatia-findings.json)
          printf 'total=%s\ncritical=%s\nhigh=%s\nmedium=%s\nlow=%s\n' \
            "$TOTAL" "$CRITICAL" "$HIGH" "$MEDIUM" "$LOW" >> "$GITHUB_OUTPUT"
      - name: Emit Hypatia annotations
        run: |
          set -euo pipefail
          jq -r --arg ws "$GITHUB_WORKSPACE" '
            # Return input as text with %, CR, LF, colon, and comma escaped
            # for GitHub workflow annotations.
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub(":"; "%3A") | gsub(","; "%2C");
            .[]
            | select(.file != null)
            | (.file | ltrimstr($ws + "/") | esc) as $file
            | (.line // 1) as $line
            | (.reason // .message // .type // "finding" | esc) as $message
            | if .severity == "critical" or .severity == "high" then
                "::error file=\($file),line=\($line)::[hypatia] \($message)"
              else
                "::warning file=\($file),line=\($line)::[hypatia] \($message)"
              end
          ' hypatia-findings.json
      - name: Write Hypatia summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Hypatia Scan Results

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.scan.outputs.critical }} |
          | High     | ${{ steps.scan.outputs.high }} |
          | Medium   | ${{ steps.scan.outputs.medium }} |
          | Low      | ${{ steps.scan.outputs.low }} |
          | **Total**| ${{ steps.scan.outputs.total }} |
          EOF
      - name: Upload Hypatia findings
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hypatia-findings
          path: hypatia-findings.json
          retention-days: 90
      - name: Fail on critical security findings
        if: steps.scan.outputs.critical > 0
        run: |
          echo "::error::Hypatia found ${{ steps.scan.outputs.critical }} critical security issue(s) — blocking merge"
          exit 1

  patch-bridge-triage:
    name: Patch Bridge CVE triage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [scanner-tools]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download pinned scanner binaries
        uses: actions/download-artifact@v8.0.2
        with:
          name: static-analysis-tools
          path: ${{ runner.temp }}/scanner-tools-artifact
      - name: Unpack pinned scanner binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner-tools"
          tar -xzf "$RUNNER_TEMP/scanner-tools-artifact/scanner-tools.tar.gz" -C "$RUNNER_TEMP/scanner-tools"
          chmod 0755 "$RUNNER_TEMP/scanner-tools"/*
          echo "$RUNNER_TEMP/scanner-tools" >> "$GITHUB_PATH"
      - name: Run Patch Bridge triage and validate its report
        id: triage
        run: |
          set -euo pipefail
          panic-attack --quiet bridge triage . --output "$RUNNER_TEMP/bridge-report.raw.json"
          ./scripts/static-analysis-report.sh canonicalize \
            "$RUNNER_TEMP/bridge-report.raw.json" bridge-report.json
          ./scripts/static-analysis-report.sh validate-bridge bridge-report.json

          jq -r 'to_entries[] | "\(.key)=\(.value)"' < <(jq '{unmitigable,mitigated,concatenative,informational}' bridge-report.json) >> "$GITHUB_OUTPUT"
      - name: Write Patch Bridge summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Patch Bridge CVE Triage

          | Classification | Count |
          |----------------|-------|
          | Unmitigable    | ${{ steps.triage.outputs.unmitigable }} |
          | Mitigated      | ${{ steps.triage.outputs.mitigated }} |
          | Concatenative  | ${{ steps.triage.outputs.concatenative }} |
          | Informational  | ${{ steps.triage.outputs.informational }} |

          The report is online triage against the pinned Patch Bridge implementation.
          Unmitigable CVEs need dependency replacement or an explicit architecture/risk decision.
          EOF
      - name: Upload Patch Bridge report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bridge-report
          path: bridge-report.json
          retention-days: 90
      - name: Warn on unmitigable CVEs
        if: steps.triage.outputs.unmitigable > 0
        run: echo "::warning::Patch Bridge found ${{ steps.triage.outputs.unmitigable }} unmitigable CVE(s) — maintainer review required"

  pons-rust-scan:
    name: Pons Rust-source scan (findings advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [scanner-tools]
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download pinned scanner binaries
        uses: actions/download-artifact@v8.0.2
        with:
          name: static-analysis-tools
          path: ${{ runner.temp }}/scanner-tools-artifact
      - name: Unpack pinned scanner binaries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner-tools"
          tar -xzf "$RUNNER_TEMP/scanner-tools-artifact/scanner-tools.tar.gz" -C "$RUNNER_TEMP/scanner-tools"
          chmod 0755 "$RUNNER_TEMP/scanner-tools"/*
          echo "$RUNNER_TEMP/scanner-tools" >> "$GITHUB_PATH"
      - name: Scan each Rust crate source directory with complete language coverage
        run: |
          set -euo pipefail
          mkdir -p pons-findings
          found=0
          for source_dir in crates/*/src; do
            [[ -d "$source_dir" ]] || continue
            found=$((found + 1))
            crate="$(basename "$(dirname "$source_dir")")"
            raw="$RUNNER_TEMP/pons-${crate}.raw.json"
            report="pons-findings/${crate}.json"
            pons scan "$source_dir" --format json --no-speculative --require-language rust --fail-on-skips > "$raw"
            ijson-jcs canon < "$raw" > "$report"
            pons validate-report "$report"
            ijson-jcs check "$report"
            jq -e 'type == "object" and (.findings | type == "array") and (.scanned.skipped | type == "array" and length == 0)' "$report" >/dev/null
            count=$(jq '.findings | length' "$report")
            printf '%s: %s finding(s), Rust coverage complete, no skipped inputs\n' "$crate" "$count"
          done
          [[ "$found" -gt 0 ]] || { echo "::error::No crates/*/src directory was scanned"; exit 1; }
      - name: Write Pons scope and baseline summary
        run: |
          {
            echo '## Pons Rust-source scan'
            echo
            echo 'Scope: `crates/*/src` only. The scanner has a Rust grammar for this tree; Idris2 and Zig sources are intentionally outside this job and are not reported as covered.'
            echo 'Findings are advisory while the first pinned baseline is reviewed. Build failures, malformed reports, missing Rust coverage, and any skipped source input fail this job.'
            echo
            for report in pons-findings/*.json; do
              crate="$(basename "$report" .json)"
              count=$(jq '.findings | length' "$report")
              printf -- '- `%s`: %s finding(s)\n' "$crate" "$count"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pons Rust reports
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pons-rust-findings
          path: pons-findings/*.json
          retention-days: 90

  deposit-findings:
    name: Deposit validated findings for gitbot-fleet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [panic-attack-assail, hypatia-scan, patch-bridge-triage, pons-rust-scan]
    if: ${{ !cancelled() && needs.patch-bridge-triage.result == 'success' && needs.pons-rust-scan.result == 'success' && needs.panic-attack-assail.result != 'skipped' && needs.hypatia-scan.result != 'skipped' }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Download panic-attack findings
        uses: actions/download-artifact@v8.0.2
        with:
          name: panic-attack-findings
          path: findings/
      - name: Download Hypatia findings
        uses: actions/download-artifact@v8.0.2
        with:
          name: hypatia-findings
          path: findings/
      - name: Download Patch Bridge report
        uses: actions/download-artifact@v8.0.2
        with:
          name: bridge-report
          path: findings/
      - name: Download JCS validator binary
        uses: actions/download-artifact@v8.0.2
        with:
          name: static-analysis-tools
          path: ${{ runner.temp }}/scanner-tools-artifact
      - name: Unpack JCS validator binary
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scanner-tools"
          tar -xzf "$RUNNER_TEMP/scanner-tools-artifact/scanner-tools.tar.gz" -C "$RUNNER_TEMP/scanner-tools"
          chmod 0755 "$RUNNER_TEMP/scanner-tools"/*
          echo "$RUNNER_TEMP/scanner-tools" >> "$GITHUB_PATH"
      - name: Assemble and validate canonical unified report
        id: combine
        env:
          REPORT_REPOSITORY: ${{ github.repository }}
          REPORT_SHA: ${{ github.sha }}
          REPORT_REF: ${{ github.ref }}
          REPORT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ./scripts/static-analysis-report.sh assemble \
            findings/panic-attack-findings.json \
            findings/hypatia-findings.json \
            findings/bridge-report.json \
            findings/unified-findings.json \
            "$REPORT_REPOSITORY" "$REPORT_SHA" "$REPORT_REF" "$REPORT_RUN_ID" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          TOTAL=$(jq '.findings | length' findings/unified-findings.json)
          CRITICAL=$(jq '[.findings[] | select(.severity == "critical")] | length' findings/unified-findings.json)
          HIGH=$(jq '[.findings[] | select(.severity == "high")] | length' findings/unified-findings.json)
          MEDIUM=$(jq '[.findings[] | select(.severity == "medium")] | length' findings/unified-findings.json)
          LOW=$(jq '[.findings[] | select(.severity == "low")] | length' findings/unified-findings.json)
          printf 'total=%s\ncritical=%s\nhigh=%s\nmedium=%s\nlow=%s\n' \
            "$TOTAL" "$CRITICAL" "$HIGH" "$MEDIUM" "$LOW" >> "$GITHUB_OUTPUT"
      - name: Emit unified scanner annotations
        run: |
          set -euo pipefail
          jq -r --arg ws "$GITHUB_WORKSPACE" '
            # Return input as text with %, CR, LF, colon, and comma escaped
            # for GitHub workflow annotations.
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub(":"; "%3A") | gsub(","; "%2C");
            .findings[]
            | select(.file != null)
            | (.file | ltrimstr($ws + "/") | esc) as $file
            | (.line // 1) as $line
            | (.description // .reason // .message // .type // "finding" | esc) as $message
            | if .severity == "critical" or .severity == "high" then
                "::error file=\($file),line=\($line)::[\(.scanner)] \($message)"
              else
                "::warning file=\($file),line=\($line)::[\(.scanner)] \($message)"
              end
          ' findings/unified-findings.json
      - name: Upload unified findings for gitbot-fleet
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unified-findings
          path: findings/unified-findings.json
          retention-days: 90
      - name: Write unified deposit summary
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Validated Unified Findings Deposit

          **Repository:** ${{ github.repository }}
          **Commit:** `${{ github.sha }}`
          **Deposited at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          | Severity | Count |
          |----------|-------|
          | Critical | ${{ steps.combine.outputs.critical }} |
          | High     | ${{ steps.combine.outputs.high }} |
          | Medium   | ${{ steps.combine.outputs.medium }} |
          | Low      | ${{ steps.combine.outputs.low }} |
          | **Total**| ${{ steps.combine.outputs.total }} |

          Findings saved as the canonical `unified-findings` artifact.
          Pons Rust reports are available separately as `pons-rust-findings`.
          EOF
