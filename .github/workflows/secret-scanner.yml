name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Single secret scanner. The standards reusable runs gitleaks (+ a Rust-secrets
# check). An inline TruffleHog job previously lived here, but the reusable
# DELIBERATELY retired TruffleHog as redundant (gitleaks gives sufficient
# coverage at lower cost — see the reusable's header). Re-adding it was
# duplicated work, not extra coverage, so it has been removed. See
# .github/workflows/README.adoc.
#
# ── Why this is pinned to standards main, not the template's pin ────────────
#
# The RSR template ships `@d135b05…`, which as of 2026-07-22 is 82 commits
# behind standards main and has two problems:
#
#   1. Its gitleaks step is `continue-on-error: true` — a gate that cannot
#      fail, which is not a gate.
#   2. Its gitleaks job requests `pull-requests: write` + `actions: read`, but
#      a caller cannot grant more than its own workflow-level `permissions:`
#      block allows. With `contents: read` at the top, this run startup-failed
#      before executing a single step.
#
# The current reusable fixes both: a checksum-verified pinned binary running
# `gitleaks detect --exit-code 1`, needing only `contents: read`.
#
# ── Why `.gitleaks.toml` is committed here ──────────────────────────────────
#
# The reusable runs `gitleaks detect --source .` with **no `--config`**.
# Gitleaks auto-discovers `.gitleaks.toml` from `--source`, i.e. from THIS
# repo — so standards' own baseline protects standards and nothing else. A
# caller that re-pins without a local baseline gets a real, gating,
# baseline-less scan and a wall of false positives (lockfile integrity
# digests, package UUIDs, GPG fingerprints, test vectors) — which is very
# likely why `continue-on-error` was added in the first place.
#
# The re-pin and the baseline must therefore stay together: re-pinning without
# it arms a noise cannon, and the baseline without the re-pin does nothing.
jobs:
  scan:
    permissions:
      contents: read
    # The pinned reusable installs and runs standalone scanners and contains no
    # runtime secret references. Do not inherit unrelated estate credentials.
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
