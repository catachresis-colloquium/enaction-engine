name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    # Pinned to the standards commit secret-scanner.yml already runs on.
    # GitHub validates a reusable workflow against the DEFINING repository's
    # own .github/workflows/actions.lock at the pinned commit. At the previous
    # pin (da2c748, 2026-09-10) that lock recorded each action this workflow
    # uses with `ref:` equal to its own SHA, a record the runner refuses, so
    # every run ended startup_failure with zero jobs (standards
    # docs/GOVERNANCE-STARTUP-REPAIR.adoc lists da2c748 as POISON). At b8f6051
    # each record names a reviewed tag. Re-pin only to a commit whose lock has
    # been checked the same way; "newest" is not a safe default.
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
    # Reusable called-workflow permissions are CAPPED by the caller's grants;
    # without security-events: write here the scorecard SARIF upload fails with
    # startup_failure (hypatia WF018). id-token: write enables OIDC publish.
    # actions: read is requested by the reusable's `scorecard` JOB at the
    # pinned SHA (Scorecard's Packaging check lists workflow runs). A caller
    # granting less than a called job requests is a 0-second startup_failure
    # before any job runs (standards' rust-ci-reusable.yml documents the same
    # trap in reverse).
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
