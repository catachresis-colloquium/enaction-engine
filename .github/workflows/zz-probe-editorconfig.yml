#
# TEMPORARY measurement probe for pull request 133. Remove before merge.
#
# GitHub does not report why it refuses a run at startup. This workflow names
# one action and runs nothing from it: the step is disabled. If the run
# creates a job, the Actions policy that applies to this repository admits the
# action. If it ends startup_failure with zero jobs, the policy refuses it.
#
# Needed by the standards reusable workflow(s): governance.
name: "Probe: editorconfig"

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    name: "probe editorconfig"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Named so the policy is consulted; never executed
        if: ${{ false }}
        uses: editorconfig-checker/action-editorconfig-checker@51f63319f592f97930c73d9c46184d20bd206393 # v3.0.0
      - name: Report that the run started
        run: echo "started"
