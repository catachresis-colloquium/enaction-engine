# This workflow is managed by gh actions-lock.
# Rust CI — explicit repository checks plus the Zig-linked accelerator seam.
# Keeping these steps local avoids an opaque startup failure in GitHub's
# reusable-workflow loader while preserving every previously intended gate.
name: Rust CI
on:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  rust-ci:
    name: Check, format, clippy, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Cargo check
        run: cargo check --locked --all-targets
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
  # enaction-accelerator-native links a Zig-built static library. The shared
  # Rust leg has no Zig toolchain, so the crate sits outside the workspace
  # default-members (Cargo.toml) and gets its own visible, failable leg here
  # — the estate doctrine forbids silent skips. Zig pin matches mise.toml /
  # .tool-versions (0.16.0: build.zig uses the 0.15+ addLibrary API and the
  # committed artefacts were built with 0.16.0).
  accelerator:
    name: Accelerator (Zig-linked)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust toolchain
        # Explicit install rather than the runner's preinstalled Rust keeps
        # this leg on the same stable toolchain as the main Rust job. Avoiding
        # a setup Action also removes a false conflict between literal SHA-pin
        # scanners and the repository's single actions.lock pin authority.
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
      - name: Install pinned Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Zig unit tests (FFI seam)
        working-directory: src/interface/ffi
        run: zig build test
      - name: Reject 32-bit native accelerator targets
        run: bash scripts/check-accelerator-target-boundary.sh
      - name: Native accelerator — check, clippy, test
        run: |
          cargo check --locked -p enaction-accelerator-native --all-targets
          cargo clippy --locked -p enaction-accelerator-native --all-targets -- -D warnings
          cargo test --locked -p enaction-accelerator-native --all-targets
      - name: M1 benchmark smoke (synthetic, no performance threshold)
        run: bash scripts/bench-accelerator-m1.sh compare target/m1-ci 1 1
