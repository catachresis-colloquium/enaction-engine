# This workflow is managed by gh actions-lock.
name: OikosBot Sustainability Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  oikosbot:
    name: Sustainability Analysis
    # Runs the published composite action (hyperpolymath/oikosbot@v0.1.1).
    # This repo is the proven pilot: 101 SARIF results ingested on PR #21.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      # OikosBot's own composite action runs the published CLI container.
      # It replaces the former hand-rolled job, which could never work:
      # it pinned ghcr.io/hyperpolymath/oikos:v2.0.0 (a tag that has never
      # existed on the package) as a `container:` image, and masked the
      # resulting failure with `|| echo`. Config comes from .oikos.yml.
      - name: Run OikosBot analysis
        uses: hyperpolymath/oikosbot@v0.1.3
        with:
          mode: report
          path: .
          output: results.sarif
          # v0.1.1 defaults to a removed manifest. This is the current public
          # amd64 image, resolved from GHCR's registry and pinned immutably.
          image: ghcr.io/hyperpolymath/oikos@sha256:35eb0aca8dd4baee3fdba9967c323ab17afc3911fda2b369ce61ac1aa75da03c

      # No `if: always()` here: when the analysis step fails (e.g. the oikos
      # image can't be pulled), running the upload anyway just adds a second,
      # misleading "Path does not exist: results.sarif" error on top of the
      # real one. One honest failure beats two.
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.39.1
        with:
          sarif_file: results.sarif
          category: oikosbot
