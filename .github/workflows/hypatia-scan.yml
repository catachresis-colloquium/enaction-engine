# This workflow is managed by gh actions-lock.
#
# Standalone Hypatia security scan (push / PR / weekly). This is NOT a duplicate
# of the `hypatia-scan` job in `static-analysis-gate.yml`: that job exists to
# feed the gitbot-fleet LEARNING pipeline (via `deposit-findings`), whereas this
# workflow is the repo's independent security scan. Same tool, two consumers.
# See .github/workflows/README.adoc.
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  merge_group:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    # Pinned to the standards commit secret-scanner.yml already runs on.
    # The actions a reusable workflow uses are covered by the lock of the
    # repository that DEFINES it, read at the pinned commit. At the previous
    # pin (da2c748, 2026-09-10) that lock recorded each action this workflow
    # uses with `ref:` equal to its own SHA, a record the runner rejects
    # (standards docs/GOVERNANCE-STARTUP-REPAIR.adoc lists da2c748 as POISON).
    # At b8f6051 each record names a reviewed tag that still points at the
    # locked commit. Re-pin only to a commit whose lock has been checked the
    # same way; "newest" is not a safe default.
    uses: metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml@b8f60511e76c9015d86990317162dce653c92fe1
