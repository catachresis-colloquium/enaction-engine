# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: AGPL-3.0-or-later
# This workflow is managed by gh actions-lock.
# workflow-linter.yml - Validates GitHub workflows against RSR security standards
# This workflow can be copied to other repos for consistent enforcement
name: Workflow Security Linter

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Check SPDX Headers
        run: |
          echo "=== Testing SPDX Checker ==="
          mkdir -p /tmp/spdx_test
          cat << 'EOF' > /tmp/spdx_test/valid.yml
          # This workflow is managed by gh actions-lock.
          # SPDX-License-Identifier: AGPL-3.0-or-later
          name: Valid
          EOF
          cat << 'EOF' > /tmp/spdx_test/invalid.yml
          # SPDX-License-Identifier: MPL-2.0
          name: Invalid
          EOF
          cat << 'EOF' > /tmp/spdx_test/missing.yml
          name: Missing
          EOF
          check_spdx() {
            awk '/^---[[:space:]]*$/ { next } /^#/ { print; next } { exit }' "$1" | grep -qx '# SPDX-License-Identifier: AGPL-3.0-or-later'
          }
          if ! check_spdx /tmp/spdx_test/valid.yml; then echo "Test failed: rejected valid header"; exit 1; fi
          if check_spdx /tmp/spdx_test/invalid.yml; then echo "Test failed: accepted invalid header"; exit 1; fi
          if check_spdx /tmp/spdx_test/missing.yml; then echo "Test failed: accepted missing header"; exit 1; fi
          echo "SPDX test passed"
          
          echo "=== Checking SPDX License Headers ==="
          failed=0
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            # gh actions-lock owns line 1 and places its management marker
            # before the licence. Inspect the complete leading comment block
            # and enforce this AGPL repository's exact code licence.
            if ! awk '/^---[[:space:]]*$/ { next } /^#/ { print; next } { exit }' "$file" \
                 | grep -qx '# SPDX-License-Identifier: AGPL-3.0-or-later'; then
              echo "ERROR: $file has no AGPL-3.0-or-later SPDX identifier in its header comment block"
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "Add '# SPDX-License-Identifier: AGPL-3.0-or-later' to the leading comment block"
            exit 1
          fi
          echo "All workflows have SPDX headers"

      - name: Test foundation workflow contracts
        run: |
          set -euo pipefail
          bash tests/workflows/foundation_ci_config_test.sh
          bash tests/workflows/lock_sync_gate_test.sh
          bash tests/workflows/check_lock_sync_test.sh
          bash tests/workflows/proven_tests_config_test.sh
          bash tests/workflows/validate_workflows_test.sh

      - name: Test static-analysis report contracts
        run: bash tests/workflows/static_analysis_report_test.sh

      - name: Check Permissions Declaration
        run: |
          echo "=== Checking Permissions ==="
          failed=0
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue
            if ! grep -q "^permissions:" "$file"; then
              echo "ERROR: $file missing top-level 'permissions:' declaration"
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then
            echo "Add a top-level 'permissions:' block (e.g. contents: read)"
            exit 1
          fi
          echo "All workflows have permissions declared"

      - name: Check Action Lock Coverage and Reusable Workflow Pins
        run: |
          set -euo pipefail
          echo "=== Checking Action Lock Coverage and Pinning ==="
          if [ ! -f .github/workflows/actions.lock ]; then
            echo "ERROR: .github/workflows/actions.lock is required"
            exit 1
          fi

          # The repository-local checker verifies direct actions, job-level
          # reusable workflows, stale entries, and transitive dependency closure.
          ./scripts/check-lock-sync.sh

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEMP_DIR"' EXIT
          if grep -rnE "^[[:space:]]+uses:.*/\\.github/workflows/.*\\.ya?ml@" .github/workflows/ \
              >"$TEMP_DIR/reusable"; then
            if grep -vE "@[a-f0-9]{40}" "$TEMP_DIR/reusable" >"$TEMP_DIR/unpinned"; then
              echo "ERROR: cross-repo reusable workflows must use a full 40-character SHA:"
              cat "$TEMP_DIR/unpinned"
              exit 1
            else
              status=$?
              if [ "$status" -gt 1 ]; then
                echo "ERROR: failed to filter reusable-workflow pins (grep exit $status)" >&2
                exit 1
              fi
            fi
          else
            status=$?
            if [ "$status" -eq 1 ]; then
              : # No cross-repo reusable workflows were found.
            else
              echo "ERROR: failed to inspect reusable-workflow pins (grep exit $status)" >&2
              exit 1
            fi
          fi
          echo "Lockfile verification passed; reusable workflow pins are 40-hex"

      - name: Check for Duplicate Workflows
        run: |
          echo "=== Checking for Duplicates ==="
          # Known duplicate patterns
          if [ -f .github/workflows/codeql.yml ] && [ -f .github/workflows/codeql-analysis.yml ]; then
            echo "ERROR: Duplicate CodeQL workflows found"
            echo "Delete codeql-analysis.yml (keep codeql.yml)"
            exit 1
          fi
          if [ -f .github/workflows/rust.yml ] && [ -f .github/workflows/rust-ci.yml ]; then
            echo "WARNING: Potential duplicate Rust workflows"
            echo "Consider consolidating rust.yml and rust-ci.yml"
          fi
          echo "No critical duplicates found"

      - name: Check CodeQL Language Matrix
        run: |
          echo "=== Checking CodeQL Configuration ==="
          if [ ! -f .github/workflows/codeql.yml ]; then
            echo "No CodeQL workflow found (optional)"
            exit 0
          fi

          # Detect repo languages
          has_js=$(find . -name "*.js" -o -name "*.ts" -o -name "*.jsx" -o -name "*.tsx" -path "*/src/*" -o -path "*/lib/*" 2>/dev/null | head -1)
          has_py=$(find . -name "*.py" -path "*/src/*" -o -path "*/lib/*" 2>/dev/null | head -1)
          has_go=$(find . -name "*.go" -path "*/src/*" -o -path "*/cmd/*" -o -path "*/pkg/*" 2>/dev/null | head -1)
          has_rs=$(find . -name "*.rs" -path "*/src/*" 2>/dev/null | head -1)
          has_java=$(find . -name "*.java" -path "*/src/*" 2>/dev/null | head -1)
          has_rb=$(find . -name "*.rb" -path "*/lib/*" -o -path "*/app/*" 2>/dev/null | head -1)

          echo "Detected languages:"
          [ -n "$has_js" ] && echo "  - javascript-typescript"
          [ -n "$has_py" ] && echo "  - python"
          [ -n "$has_go" ] && echo "  - go"
          [ -n "$has_rs" ] && echo "  - rust (note: CodeQL rust is limited)"
          [ -n "$has_java" ] && echo "  - java-kotlin"
          [ -n "$has_rb" ] && echo "  - ruby"

          # Check for over-reach
          if grep -q "language:.*'go'" .github/workflows/codeql.yml && [ -z "$has_go" ]; then
            echo "WARNING: CodeQL configured for Go but no Go files found"
          fi
          if grep -q "language:.*'python'" .github/workflows/codeql.yml && [ -z "$has_py" ]; then
            echo "WARNING: CodeQL configured for Python but no Python files found"
          fi
          if grep -q "language:.*'java'" .github/workflows/codeql.yml && [ -z "$has_java" ]; then
            echo "WARNING: CodeQL configured for Java but no Java files found"
          fi
          if grep -q "language:.*'ruby'" .github/workflows/codeql.yml && [ -z "$has_rb" ]; then
            echo "WARNING: CodeQL configured for Ruby but no Ruby files found"
          fi

          echo "CodeQL check complete"

      - name: Check Secrets Guards
        run: |
          echo "=== Checking Secrets Usage ==="
          # Look for secrets without conditional guards in mirror workflows
          if [ -f .github/workflows/mirror.yml ]; then
            if grep -q "secrets\." .github/workflows/mirror.yml; then
              if ! grep -q "if:.*vars\." .github/workflows/mirror.yml; then
                echo "WARNING: mirror.yml uses secrets without vars guard"
                echo "Add 'if: vars.FEATURE_ENABLED == true' to jobs"
              fi
            fi
          fi
          echo "Secrets check complete"

      - name: Summary
        run: |
          echo ""
          echo "=== Workflow Linter Summary ==="
          echo "All critical checks passed."
          echo ""
          echo "For more info, see: robot-repo-bot/ERROR-CATALOG.scm"
