# SPDX-License-Identifier: AGPL-3.0-or-later
name: Proven Tests and Benches

# The framework source is fetched by immutable commit. Checkout uses one
# immutable release tag and is covered by actions.lock; credentials are not
# persisted for any later step.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: proven-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proven-tests:
    name: Idris2 ABI suite and proof manifest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch and verify pinned proven-tests-and-benches source
        env:
          FRAMEWORK_COMMIT: eca682bcd419554f6779e72969902e6faef4fd9d
        run: |
          set -euo pipefail
          framework="$RUNNER_TEMP/proven-tests-and-benches"
          git init -q "$framework"
          git -C "$framework" remote add origin https://github.com/hyperpolymath/proven-tests-and-benches.git
          git -C "$framework" fetch -q --depth 1 origin "$FRAMEWORK_COMMIT"
          git -C "$framework" checkout -q --detach FETCH_HEAD
          test "$(git -C "$framework" rev-parse HEAD)" = "$FRAMEWORK_COMMIT"

      - name: Install Chez Scheme and pinned Idris2 via framework bootstrap
        env:
          IDRIS2_VERSION: v0.7.0
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/proven-tests-and-benches/scripts/install-idris2.sh"
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: Build and run the Enaction Engine Proven-Tests suite
        env:
          PROVEN_TESTS_ROOT: ${{ runner.temp }}/proven-tests-and-benches
        run: scripts/run-proven-tests.sh "$PROVEN_TESTS_ROOT"

      - name: Typecheck every gated Idris2 proof module
        run: bash scripts/check-proofs.sh idris2
